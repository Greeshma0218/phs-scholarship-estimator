<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHS Scholarship Estimator — New College of Florida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #17233d;
    --navy-2: #253a63;
    --gold: #b9902f;
    --paper: #f3f4f0;
    --panel: #ffffff;
    --line: #d9dad3;
    --ink: #1c2024;
    --ink-soft: #55595f;
    --green: #2c6b4a;
    --green-bg: #eaf3ee;
    --red: #9c3b2e;
    --red-bg: #f7ece9;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.5;
    padding:0 0 64px;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:36px 24px 30px;
    border-bottom:4px solid var(--gold);
  }
  header .inner{max-width:640px;margin:0 auto;}
  header .brand{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 8px;
  }
  header h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:1.9rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  main{max-width:640px;margin:0 auto;padding:0 24px;}

  .mode-switch{
    display:flex;
    gap:2px;
    margin:28px 0 22px;
    background:var(--line);
    padding:2px;
    border-radius:var(--radius);
  }
  .mode-switch button{
    flex:1;
    border:none;
    background:transparent;
    padding:11px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.92rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:2px;
    transition:background .15s ease, color .15s ease;
  }
  .mode-switch button.active{
    background:var(--navy);
    color:#fff;
  }

  section.panel{display:none;}
  section.panel.active{display:block;}

  .tier-select{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:16px 18px;
    border-radius:var(--radius);
  }
  .tier-select .label-row{
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:600;
  }
  .tier-select label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:0.94rem;
    cursor:pointer;
    padding:6px 4px;
  }
  .tier-select input[type=radio]{margin-top:3px;}
  .tier-select .tier-note{
    display:block;
    color:var(--ink-soft);
    font-size:0.83rem;
    margin-top:2px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 24px;
  }

  .card h2{
    font-family:'Source Serif 4', serif;
    font-size:1.08rem;
    font-weight:600;
    margin:0 0 14px;
    color:var(--navy);
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    margin-bottom:5px;
    color:var(--ink);
  }
  .field input[type=number]{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.98rem;
    background:#fff;
  }
  .field input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .field-hint{font-size:0.78rem; color:var(--ink-soft); margin-top:-8px; margin-bottom:16px;}

  .result{
    margin-top:20px;
    padding:20px 22px;
    border-radius:var(--radius);
    background:var(--green-bg);
    border:1px solid #cfe4d8;
    display:none;
  }
  .result.show{display:block;}
  .result.ineligible{background:var(--red-bg); border-color:#e6cec8;}
  .result .kicker{
    font-size:0.76rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .result .figure{
    font-family:'Source Serif 4', serif;
    font-size:1.7rem;
    font-weight:700;
    color:var(--green);
    line-height:1.2;
  }
  .result.ineligible .figure{color:var(--red); font-size:1.05rem;}
</style>
</head>
<body>

<header>
  <div class="inner">
    <p class="brand">New College of Florida</p>
    <h1>PHS Scholarship Estimator</h1>
  </div>
</header>

<main>

  <div class="mode-switch">
    <button type="button" class="active" data-mode="ftic">Freshman / FTIC</button>
    <button type="button" data-mode="transfer">Transfer</button>
  </div>

  <!-- ================= FTIC PANEL ================= -->
  <section class="panel active" id="panel-ftic">
    <div class="card">
      <h2>Estimate an Award</h2>
      <div class="field">
        <label for="ftic-gpa-input">High School Weighted GPA</label>
        <input type="number" id="ftic-gpa-input" step="0.01" min="0" max="5" placeholder="e.g. 3.85">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ftic-sat-input">SAT</label>
          <input type="number" id="ftic-sat-input" placeholder="e.g. 1310">
        </div>
        <div class="field">
          <label for="ftic-act-input">ACT</label>
          <input type="number" id="ftic-act-input" placeholder="e.g. 27">
        </div>
        <div class="field">
          <label for="ftic-clt-input">CLT</label>
          <input type="number" id="ftic-clt-input" placeholder="e.g. 90">
        </div>
      </div>
      <div class="field-hint">Enter a GPA and/or any test score you have — a result appears once at least one is entered.</div>
      <div class="result" id="ftic-result"></div>
    </div>
  </section>

  <!-- ================= TRANSFER PANEL ================= -->
  <section class="panel" id="panel-transfer">
    <div class="tier-select">
      <div class="label-row">Transfer Category</div>
      <label>
        <input type="radio" name="tier" value="transform" checked>
        <span>Transform Partner School AA Degree<span class="tier-note">Associate degree from an NCF Transform partner institution</span></span>
      </label>
      <label>
        <input type="radio" name="tier" value="aa">
        <span>Students with an AA Degree<span class="tier-note">Associate degree from a non-Transform institution</span></span>
      </label>
      <label>
        <input type="radio" name="tier" value="mid">
        <span>Mid-Level Transfer<span class="tier-note">No AA, but at least 30 completed college credits including college-level Math and English Composition</span></span>
      </label>
      <label>
        <input type="radio" name="tier" value="low">
        <span>Fewer Than 30 Completed Credits<span class="tier-note">Evaluated on Freshman/FTIC criteria</span></span>
      </label>
    </div>

    <div class="card">
      <h2>Estimate an Award</h2>
      <div class="field">
        <label for="transfer-gpa-input">College Cumulative GPA</label>
        <input type="number" id="transfer-gpa-input" step="0.01" min="0" max="4" placeholder="e.g. 3.40">
      </div>
      <div id="transfer-test-fields" style="display:none;">
        <div class="field-row">
          <div class="field">
            <label for="transfer-sat-input">SAT</label>
            <input type="number" id="transfer-sat-input" placeholder="e.g. 1180">
          </div>
          <div class="field">
            <label for="transfer-act-input">ACT</label>
            <input type="number" id="transfer-act-input" placeholder="e.g. 24">
          </div>
          <div class="field">
            <label for="transfer-clt-input">CLT</label>
            <input type="number" id="transfer-clt-input" placeholder="e.g. 78">
          </div>
        </div>
        <div class="field-hint">Fewer than 30 credits is scored like a Freshman/FTIC applicant — GPA and test scores both count.</div>
      </div>
      <div class="result" id="transfer-result"></div>
    </div>
  </section>

</main>

<script>
/* ---------- FTIC award data (Fall 2026 PHS Decision Framework) ---------- */
const gpaLevels = [
  {level:1, min:4.25, amount:8000},
  {level:2, min:4.00, amount:5000},
  {level:3, min:3.75, amount:3500},
  {level:4, min:3.50, amount:2500},
  {level:5, min:3.25, amount:1000},
  {level:6, min:-Infinity, amount:250},
];
const testLevels = [
  {level:1, sat:1400, act:31, clt:100, amount:8000},
  {level:2, sat:1340, act:29, clt:96, amount:5000},
  {level:3, sat:1210, act:25, clt:84, amount:4000},
  {level:4, sat:1100, act:22, clt:72, amount:2000},
  {level:5, sat:-Infinity, act:19, clt:64, amount:250},
];
const MIN_AWARD = 500;
const PIC_AWARD = 23733;

const transferTierData = {
  transform: { name: "Transform Partner School AA Degree", bands: [ {min:3.50, amount:10000}, {min:3.00, amount:7500} ] },
  aa:        { name: "Students with an AA Degree",          bands: [ {min:3.50, amount:7500},  {min:3.00, amount:5000} ] },
  mid:       { name: "Mid-Level Transfer",                  bands: [ {min:3.50, amount:7500},  {min:3.00, amount:5000} ] },
};

/* ---------- helpers ---------- */
const fmt = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtRange = n => {
  const low = Math.max(0, Math.round(n) - 1000);
  const high = Math.round(n) + 1000;
  return `${fmt(low)} – ${fmt(high)}`;
};

function gpaLevelFor(gpa) {
  return gpaLevels.find(r => gpa >= r.min) || gpaLevels[gpaLevels.length - 1];
}
function testLevelForScore(type, score) {
  if (score === null || isNaN(score)) return null;
  return testLevels.find(r => score >= r[type]) || testLevels[testLevels.length - 1];
}
function bestTestLevel(sat, act, clt) {
  const candidates = [
    testLevelForScore("sat", sat),
    testLevelForScore("act", act),
    testLevelForScore("clt", clt),
  ].filter(Boolean);
  if (candidates.length === 0) return null;
  return candidates.reduce((best, r) => (r.level < best.level ? r : best));
}

// FTIC / "fewer than 30 credits" prediction: no stacking — higher of GPA vs
// Test applies, PIC auto-detected at the top band, $500 minimum guaranteed.
function predictFtic(gpa, tRow) {
  const hasGpa = !isNaN(gpa);
  const gRow = hasGpa ? gpaLevelFor(gpa) : null;

  if (hasGpa && gRow.level === 1 && tRow && tRow.level === 1) {
    return PIC_AWARD;
  }
  const amounts = [];
  if (gRow) amounts.push(gRow.amount);
  if (tRow) amounts.push(tRow.amount);
  if (amounts.length === 0) return null;
  return Math.max(...amounts, MIN_AWARD);
}

/* ---------- FTIC panel ---------- */
function renderFticResult() {
  const resultEl = document.getElementById("ftic-result");
  const gpa = parseFloat(document.getElementById("ftic-gpa-input").value);
  const sat = parseFloat(document.getElementById("ftic-sat-input").value);
  const act = parseFloat(document.getElementById("ftic-act-input").value);
  const clt = parseFloat(document.getElementById("ftic-clt-input").value);
  const tRow = bestTestLevel(sat, act, clt);

  const award = predictFtic(gpa, tRow);
  if (award === null) {
    resultEl.className = "result";
    resultEl.innerHTML = "";
    return;
  }
  const isPic = award === PIC_AWARD;
  resultEl.className = "result show";
  resultEl.innerHTML = `<div class="kicker">Estimated PHS Award</div><div class="figure">${isPic ? fmt(award) : fmtRange(award)}</div>`;
}
["ftic-gpa-input","ftic-sat-input","ftic-act-input","ftic-clt-input"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderFticResult);
});

/* ---------- Transfer panel ---------- */
const transferTestFieldsEl = document.getElementById("transfer-test-fields");

function currentTier() {
  return document.querySelector('input[name="tier"]:checked').value;
}

function renderTransferResult() {
  const tier = currentTier();
  const resultEl = document.getElementById("transfer-result");
  const gpa = parseFloat(document.getElementById("transfer-gpa-input").value);

  transferTestFieldsEl.style.display = tier === "low" ? "block" : "none";

  if (isNaN(gpa)) {
    resultEl.className = "result";
    resultEl.innerHTML = "";
    return;
  }

  if (tier === "low") {
    if (gpa >= 3.00) {
      const sat = parseFloat(document.getElementById("transfer-sat-input").value);
      const act = parseFloat(document.getElementById("transfer-act-input").value);
      const clt = parseFloat(document.getElementById("transfer-clt-input").value);
      const tRow = bestTestLevel(sat, act, clt);
      const award = predictFtic(gpa, tRow);
      resultEl.className = "result show";
      resultEl.innerHTML = `<div class="kicker">Estimated PHS Award</div><div class="figure">${fmtRange(award)}</div>`;
    } else if (gpa >= 2.70) {
      resultEl.className = "result show";
      resultEl.innerHTML = `<div class="kicker">Estimated PHS Award</div><div class="figure">${fmt(500)}</div>`;
    } else {
      resultEl.className = "result show ineligible";
      resultEl.innerHTML = `<div class="figure">Requires VP approval — no standard estimate available.</div>`;
    }
    return;
  }

  const tierInfo = transferTierData[tier];
  const band = tierInfo.bands.find(b => gpa >= b.min);
  const award = band ? band.amount : MIN_AWARD;
  resultEl.className = "result show";
  resultEl.innerHTML = `<div class="kicker">Estimated PHS Award</div><div class="figure">${fmtRange(award)}</div>`;
}

document.getElementById("transfer-gpa-input").addEventListener("input", renderTransferResult);
["transfer-sat-input","transfer-act-input","transfer-clt-input"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderTransferResult);
});
document.querySelectorAll('input[name="tier"]').forEach(r => r.addEventListener("change", renderTransferResult));
renderTransferResult();

/* ---------- mode switch ---------- */
document.querySelectorAll(".mode-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const mode = btn.dataset.mode;
    document.getElementById("panel-ftic").classList.toggle("active", mode === "ftic");
    document.getElementById("panel-transfer").classList.toggle("active", mode === "transfer");
  });
});
</script>

</body>
</html>
